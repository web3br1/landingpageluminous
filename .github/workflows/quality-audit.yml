name: Quality Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run Quality Audit
      run: |
        # Run comprehensive audit including specialized analyzers
        node compliance-engine/specialized/analyzers/audit-integrations-and-unused.mjs
        node compliance-engine/core/quality-audit.mjs audit
      continue-on-error: true
    
    - name: Run Compliance Check
      run: node compliance-engine/core/compliance-core.mjs --check
      continue-on-error: true
