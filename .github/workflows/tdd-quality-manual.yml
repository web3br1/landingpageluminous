name: TDD Quality Manual Check

on:
  workflow_dispatch:
    inputs:
      test_categories:
        description: 'Test categories to run (comma-separated: unit,integration,e2e,all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - performance
          - accessibility
      fail_on_quality_gate:
        description: 'Fail if quality score is below threshold'
        required: false
        default: true
        type: boolean

jobs:
  quality-assessment:
    name: Quality Assessment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TDD Quality Assessment
        run: |
          echo "🚀 Executing TDD Quality Assessment"
          echo "Test Categories: ${{ inputs.test_categories }}"
          echo "Fail on Quality Gate: ${{ inputs.fail_on_quality_gate }}"
          echo ""

          node scripts/tdd-quality-verification.mjs

      - name: Generate Quality Badge
        run: |
          SCORE=$(node scripts/tdd-quality-verification.mjs | grep "Score Final" | sed 's/.*: \([0-9.]*\).*/\1/')

          if (( $(echo "$SCORE >= 90" | bc -l) )); then
            COLOR="brightgreen"
            STATUS="excellent"
          elif (( $(echo "$SCORE >= 70" | bc -l) )); then
            COLOR="yellow"
            STATUS="good"
          else
            COLOR="red"
            STATUS="needs-improvement"
          fi

          echo "TDD Quality Score: $SCORE/100" >> $GITHUB_STEP_SUMMARY
          echo "Status: $STATUS" >> $GITHUB_STEP_SUMMARY

          # Create badge URL for README
          BADGE_URL="https://img.shields.io/badge/TDD%20Quality-$SCORE%2F100-$COLOR"
          echo "Badge URL: $BADGE_URL" >> $GITHUB_STEP_SUMMARY

      - name: Quality Gate Check
        if: inputs.fail_on_quality_gate == true
        run: |
          SCORE=$(node scripts/tdd-quality-verification.mjs | grep "Score Final" | sed 's/.*: \([0-9.]*\).*/\1/')

          if (( $(echo "$SCORE < 70" | bc -l) )); then
            echo "❌ Quality Gate Failed: Score $SCORE/100 is below minimum threshold of 70/100"
            echo ""
            echo "Recommendations:"
            echo "- Improve test naming conventions"
            echo "- Add more comprehensive test coverage"
            echo "- Refactor large test files"
            echo "- Ensure proper test isolation"
            exit 1
          else
            echo "✅ Quality Gate Passed: Score $SCORE/100 meets minimum requirements"
          fi

  targeted-tests:
    name: Run Targeted Tests
    runs-on: ubuntu-latest
    needs: quality-assessment

    strategy:
      matrix:
        test-type: ${{ fromJson(format('["{0}"]', inputs.test_categories == 'all' && '["unit","integration","e2e","performance","accessibility"]' || format('["{0}"]', inputs.test_categories))) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        if: matrix.test-type == 'unit'
        run: pnpm run test:vitest:unit

      - name: Run Integration Tests
        if: matrix.test-type == 'integration'
        run: pnpm run test:integration

      - name: Run E2E Tests
        if: matrix.test-type == 'e2e'
        run: |
          pnpm exec playwright install --with-deps
          pnpm run test:e2e:smoke

      - name: Run Performance Tests
        if: matrix.test-type == 'performance'
        run: pnpm run test:performance

      - name: Run Accessibility Tests
        if: matrix.test-type == 'accessibility'
        run: pnpm run test:a11y

  quality-report:
    name: Generate Quality Report
    runs-on: ubuntu-latest
    needs: [quality-assessment, targeted-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Comprehensive Report
        run: |
          echo "## 📊 TDD Quality Assessment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Categories**: ${{ inputs.test_categories }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gate**: ${{ inputs.fail_on_quality_gate && 'Enabled' || 'Disabled' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Quality Scores" >> $GITHUB_STEP_SUMMARY
          node scripts/tdd-quality-verification.mjs | grep -E "(Score|Nível|structure|naming|isolation|coverage|performance|maintainability)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Assessment | ${{ needs.quality-assessment.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Targeted Tests | ${{ needs.targeted-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quality-assessment.result }}" != "success" || "${{ needs.targeted-tests.result }}" != "success" ]]; then
            echo "### Issues Found 🚨" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Next Steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Review failed test categories" >> $GITHUB_STEP_SUMMARY
            echo "2. Check quality score breakdown" >> $GITHUB_STEP_SUMMARY
            echo "3. Address naming convention issues" >> $GITHUB_STEP_SUMMARY
            echo "4. Improve test coverage where needed" >> $GITHUB_STEP_SUMMARY
            echo "5. Refactor tests for better maintainability" >> $GITHUB_STEP_SUMMARY
          else
            echo "### All Checks Passed ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Great job! All TDD quality checks have passed." >> $GITHUB_STEP_SUMMARY
          fi
