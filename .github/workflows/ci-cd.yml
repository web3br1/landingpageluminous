name: 🚀 CI/CD Pipeline - Production Ready

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancelar runs anteriores no mesmo PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  # 🔍 QUALITY GATES - Bloqueiam deploy se falharem
  quality-gate:
    name: '🔍 Quality Gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Run TypeScript type check
      run: npm run typecheck

    - name: Run ESLint
      run: npm run lint

    - name: Check bundle budgets
      run: npm run bundle:gate

  # 🧪 UNIT & COMPONENT TESTS
  test-unit:
    name: '🧪 Unit Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Run unit tests with coverage
      run: npm run test:vitest:unit

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: unit
        fail_ci_if_error: false

  test-components:
    name: '🧩 Component Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Run component tests
      run: npm run test:vitest:components

  # 🔄 INTEGRATION & SSR TESTS
  test-integration:
    name: '🔄 Integration Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Run SSR tests
      run: npm run test:ssr

    - name: Run integration tests
      run: npm run test:integration

  # 🎭 E2E TESTS - Playwright
  test-e2e:
    name: '🎭 E2E Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run E2E critical flows
      run: npm run test:playwright:critical-flows

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-results
        path: |
          test-results/
          playwright-report/

  # 🏗️ BUILD VERIFICATION
  build:
    name: '🏗️ Build Verification'
    runs-on: ubuntu-latest
    needs: [quality-gate, test-unit, test-components, test-integration]
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Build application
      run: npm run build

    - name: Verify build artifacts
      run: |
        ls -la .next/
        echo "Build size check:"
        du -sh .next/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          .next/
          public/
        retention-days: 7

  # 📊 BUNDLE ANALYSIS
  bundle-analysis:
    name: '📊 Bundle Analysis'
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Run bundle analysis
      run: npm run analyze:bundle

    - name: Upload bundle report
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis
        path: .next/analyze/

  # 🔒 CSP SECURITY TESTS
  test-csp-contract:
    name: '🔒 CSP Security Contract Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Run CSP Blind Spots Audit
      run: npm run audit:csp-blindspots || (echo "❌ CSP audit failed - check issues above" && exit 1)

    - name: Start production server for contract testing
      run: |
        npm run start &
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        # Wait for server to be ready
        timeout 30 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 1; done' || (echo "❌ Server failed to start" && exit 1)

    - name: Run CSP Contract Tests
      run: npm run test:csp-contract
      env:
        NODE_ENV: production

    - name: Stop production server
      if: always()
      run: |
        if [ ! -z "$SERVER_PID" ]; then
          kill $SERVER_PID || true
        fi

    - name: Upload CSP test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: csp-test-results
        path: |
          test-results/
          scripts/audit-csp-blindspots.js
          scripts/test-csp-contract.js

  # 🚀 DEPLOYMENT
  deploy-staging:
    name: '🚀 Deploy to Staging'
    runs-on: ubuntu-latest
    needs: [test-e2e, test-csp-contract, build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Vercel CLI
      run: npm i -g vercel

    - name: Deploy to Vercel Staging
      run: vercel --yes
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Run Smoke Tests
      run: npm run test:smoke
      env:
        BASE_URL: ${{ steps.deploy.outputs.url }}

  deploy-production:
    name: '🚀 Deploy to Production'
    runs-on: ubuntu-latest
    needs: [test-e2e, build, bundle-analysis]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Vercel CLI
      run: npm i -g vercel

    - name: Deploy to Vercel Production
      run: vercel --prod --yes
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Run Smoke Tests
      run: npm run test:smoke
      env:
        BASE_URL: ${{ steps.deploy.outputs.url }}

  # 🔔 NOTIFICATIONS
  notify:
    name: '🔔 Notifications'
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
    - name: Success Notification
      if: needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success'
      run: |
        echo "🎉 Deployment successful!"
        echo "✅ Quality gates passed"
        echo "✅ All tests passed"
        echo "✅ Build successful"
        echo "🚀 Application deployed"

    - name: Failure Notification
      if: failure()
      run: |
        echo "❌ Pipeline failed!"
        echo "Check the logs above for details."
        echo "🔍 Focus on failed jobs first"
