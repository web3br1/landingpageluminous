name: CI - Landing Headers

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npm run type-check
      - name: Unit Tests
        run: npm test -- --ci --runInBand
      - name: Dependency Cruiser
        run: npm run ci:depcruise
      - name: Knip Dead Code
        run: npm run ci:knip
      - name: Bundle Analyzer (report only)
        env:
          ANALYZE: 'true'
        run: npm run build
      - name: Upload Analyzer Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyzer-report
          path: bundle-analyzer-report.html
