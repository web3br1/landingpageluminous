name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint Security
        run: |
          npx eslint . --ext .ts,.tsx,.js,.jsx --config .eslintrc.cjs --plugin security || {
            echo "⚠️  Security ESLint issues found."
            exit 1
          }

      - name: Run TypeScript strict security checks
        run: |
          npx tsc --noEmit --strict --noImplicitAny || {
            echo "❌ TypeScript security issues found (implicit any)."
            exit 1
          }

      - name: Check for insecure dependencies
        run: |
          npm audit --audit-level high || {
            echo "❌ High severity security vulnerabilities found!"
            echo "Run 'npm audit fix' to address them."
            exit 1
          }

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for hardcoded secrets
        run: |
          # Check for common secret patterns
          if grep -r "password\|secret\|token\|key" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" . --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=coverage --exclude-dir=.git | grep -v "test\|mock\|example\|placeholder"; then
            echo "⚠️  Potential hardcoded secrets found!"
            echo "Review the files above and ensure no real secrets are committed."
            exit 1
          else
            echo "✅ No hardcoded secrets detected."
          fi

      - name: Check for exposed environment variables
        run: |
          # Check for process.env usage that might expose secrets
          if grep -r "process\.env\." --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" . --exclude-dir=node_modules --exclude-dir=.next | grep -v "NEXT_PUBLIC_\|test\|mock"; then
            echo "⚠️  Potential exposed environment variables found!"
            echo "Ensure sensitive env vars are not prefixed with NEXT_PUBLIC_"
            exit 1
          else
            echo "✅ Environment variables properly secured."
          fi

  dependency-analysis:
    name: Dependency Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency cruiser
        run: |
          npm run ci:depcruise || {
            echo "❌ Architecture violations found!"
            exit 1
          }

      - name: Run knip (unused dependencies)
        run: |
          npm run ci:knip || {
            echo "⚠️  Unused dependencies detected."
            # Don't fail CI for unused deps, just warn
          }

      - name: Check for malicious packages
        run: |
          npm ls --depth=0 | grep -E "(malicious|hack|exploit|attack)" || echo "✅ No malicious packages detected."
