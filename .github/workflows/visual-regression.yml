name: Visual Regression Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'styles/**'
      - 'tailwind.config.ts'
      - 'tests/visual-regression.spec.ts'

jobs:
  visual-regression:
    name: Visual Regression Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Download baseline screenshots
        id: download-baseline
        uses: actions/cache@v4
        with:
          path: tests/visual-regression.spec.ts-snapshots
          key: visual-baseline-${{ github.sha }}
          restore-keys: |
            visual-baseline-main
            visual-baseline-

      - name: Run visual regression tests
        run: npm run test:visual
        continue-on-error: true
        id: visual-tests

      - name: Upload visual regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            test-results/
            playwright-report/
            tests/visual-regression.spec.ts-snapshots/

      - name: Update baseline screenshots (on main branch)
        if: github.ref == 'refs/heads/main' && steps.visual-tests.outcome == 'success'
        run: |
          echo "Updating baseline screenshots on main branch"
          # The cache will be updated automatically on the next run

      - name: Comment PR with visual changes
        if: github.event_name == 'pull_request' && steps.visual-tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { exec } = require('child_process')
            const { promisify } = require('util')
            const execAsync = promisify(exec)

            try {
              // Check for visual differences
              const { stdout } = await execAsync('find test-results -name "*.png" -type f | wc -l')
              const diffCount = parseInt(stdout.trim())

              if (diffCount > 0) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: '## 👁️ Visual Regression Results\n\n⚠️ **Visual differences detected:** ' + diffCount + ' screenshots have changed.\n\n### 📸 Changed Screenshots:\n- Review the artifacts below to see the visual differences\n- If changes are intentional, run `npm run test:visual:update` locally and commit the updated baselines\n\n### 📦 Artifacts:\n- **Visual Regression Results**: Download to see detailed comparisons\n- **Playwright Report**: Interactive report with side-by-side comparisons\n\n### 🔧 Actions Required:\n1. **Review changes** in the uploaded artifacts\n2. **If intentional**: Update baselines with `npm run test:visual:update`\n3. **If unexpected**: Investigate the source of visual changes'
                })
              }
            } catch (error) {
              console.log('No visual differences found or error checking:', error.message)
            }

  visual-regression-update-baseline:
    name: Update Visual Baselines
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Update visual baselines
        run: npm run test:visual:update

      - name: Commit updated baselines
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tests/visual-regression.spec.ts-snapshots/
          git commit -m "chore: update visual regression baselines" || echo "No changes to commit"
          git push
