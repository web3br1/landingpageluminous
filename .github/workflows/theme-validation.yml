name: Theme Validation

on:
  push:
    paths:
      - 'lib/theme/**'
      - 'styles/theme-layers.css'
      - 'design-system/tokens/**'
      - 'tests/hydration-theme.test.tsx'
  pull_request:
    paths:
      - 'lib/theme/**'
      - 'styles/theme-layers.css'
      - 'design-system/tokens/**'
      - 'tests/hydration-theme.test.tsx'

jobs:
  validate-themes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run theme validation
        run: npm run validate:themes

      - name: Run hydration tests
        run: npm run test:hydration

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Generate theme report
        run: |
          echo "## Theme Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Contrast validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Critical CSS generation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Hydration tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Accessibility tests passed" >> $GITHUB_STEP_SUMMARY

  performance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for performance
        run: npm run build

      - name: Run performance tests
        run: npm run test:performance

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sh .next/static | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          echo "## Performance Check" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Bundle size: $BUNDLE_SIZE" >> $GITHUB_STEP_SUMMARY